[project]
name = "DataShooterApp"
version = "0.1.1"
description = ""
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Alf Nigredo", email = "3aico.circuss@gmail.com" }
]
dependencies = [
  "flet==0.28.2",
  "pyautogui>=0.9.54",
  "pyperclip>=1.11.0",
]

[tool.flet]
build_version = "0.1.1"
build_number = 2

org = "com.alfnigredoit"
product = "DataShooterApp"
company = "Alf Nigredo IT"
copyright = "Copyright (C) 2025 by Alf Nigredo IT"

compile.app = true # --compile-app
compile.packages = true # --compile-packages
compile.cleanup = true # --cleanup-on-compile

[tool.flet.app]
path = "src"

[tool.flet.macos]
build_arch = "arm64"

[tool.uv]
dev-dependencies = [
    "flet[all]==0.28.2",
]
[tool.flet.flutter.pubspec.dependency_overrides]
webview_flutter_android = "4.10.1"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
flet = {extras = ["all"], version = "0.28.2"}
